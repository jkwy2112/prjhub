services:
  db:
    image: postgres:16-alpine
    container_name: prjhub-db
    environment:
      POSTGRES_USER: prjhub
      POSTGRES_PASSWORD: prjhub_secret
      POSTGRES_DB: prjhub
    ports:
      - "5432:5432"
    volumes:
      - prjhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prjhub -d prjhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prjhub_pgdata:
